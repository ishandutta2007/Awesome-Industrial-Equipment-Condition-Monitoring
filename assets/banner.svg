<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0F172A"/><stop offset="50%" stop-color="#1E293B"/><stop offset="100%" stop-color="#090D16"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><linearGradient id="waveGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#22D3EE" stop-opacity=".8"/><stop offset="50%" stop-color="#3B82F6" stop-opacity=".9"/><stop offset="100%" stop-color="#A855F7" stop-opacity=".8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".4" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{r:4px;opacity:.6}}.subtitle,.tagline,.title{font-family:&apos;Segoe UI&apos;,-apple-system,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.tagline{font-weight:600;font-size:14px;fill:#38bdf8;letter-spacing:2px;text-transform:uppercase}.pulse-line{fill:none;stroke:url(#waveGrad);stroke-width:3;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:dash 6s linear infinite}.node-pulse{animation:pulse 2s ease-in-out infinite alternate}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><g opacity=".35"><path fill="none" stroke="#1E293B" stroke-width="8" d="M 0 100 Q 150 40, 300 100 T 600 100 T 900 100 T 1200 100" transform="translate(0, 110)"/>